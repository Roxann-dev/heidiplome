spring.application.name=heidiplome

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.locations=classpath:db/migration

jwt.secret=ceci-est-un-secret-de-test-a-changer-en-production-32-caracteres-minimum
jwt.expiration-ms=3600000

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

aws.eventBridge.bus=${AWS_EVENT_BUS:default}
aws.s3.bucket=${AWS_S3_BUCKET:heidiplome-bucket}

server.port=0